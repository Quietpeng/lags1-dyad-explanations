[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lags1-dyad-explanations"
version = "0.1.1"
description = "Actor-role components of dyadic event forecasts: shared graph columns, near-collinearity in a 196-actor panel, and a within-panel stability audit"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jingzhe Peng", email = "pengjingzhe_quiet@foxmail.com" }]
keywords = [
  "dyadic event forecasting",
  "ICEWS",
  "explainability",
  "stability audit",
  "calibration",
  "reproducibility",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy==2.5.4",
  "pandas==2.3.3",
  "scikit-learn==1.9.1",
  "duckdb==1.5.6",
  "matplotlib==3.11.2",
  "scipy==1.18.1",
]

[project.optional-dependencies]
notebooks = [
  "nbclient>=0.11",
  "nbformat>=5.11",
  "ipykernel>=7.0",
  "jupyterlab>=4.4",
]

[project.urls]
Repository = "https://github.com/Quietpeng/lags1-dyad-explanations"

[tool.setuptools.packages.find]
include = ["framework*"]
