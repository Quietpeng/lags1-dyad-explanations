name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install analysis stack
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
      - name: Preflight
        run: make doctor PY=python3
      - name: Unit and contract tests
        run: make test PY=python3
      - name: Release verification
        run: make verify PY=python3
      - name: Stability and worldline aggregate checks
        run: |
          make stability-check PY=python3
          make worldline-check PY=python3
      - name: Build and verify the release archive
        if: matrix.python-version == '3.13'
        run: make dist PY=python3

  notebooks:
    name: notebooks (headless, CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install analysis and notebook stack
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install "nbclient>=0.11" "nbformat>=5.11" "ipykernel>=7.0"
      - name: Execute notebooks from the repository root
        run: make notebooks PY=python3
      - name: Verify committed outputs and release
        run: make verify PY=python3
